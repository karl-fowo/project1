<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库应用</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./renderer.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__head">
        <div>
          <p class="eyebrow">Knowledge Base</p>
          <h1>知识库应用</h1>
        </div>
        <div class="sidebar__count" id="doc-count">0 篇文档</div>
      </div>

      <label class="search" for="doc-search">
        <input id="doc-search" type="text" placeholder="搜索文档">
      </label>

      <div class="doc-list" id="doc-list"></div>

      <div class="storage-path" id="storage-path"></div>
    </aside>

    <main class="main">
      <section class="summary">
        <div class="main__head">
          <div>
            <p class="eyebrow">当前文档</p>
            <h2 id="doc-title">加载中</h2>
          </div>
          <div class="main__meta" id="doc-meta"></div>
        </div>

        <div class="summary__body">
          <p class="summary__text" id="doc-body"></p>
          <div class="tags" id="doc-tags"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel__head">
          <div>
            <p class="eyebrow">问答面板</p>
            <h2>向本地文档提问</h2>
          </div>
        </div>

        <div class="chat" id="chat"></div>

        <form class="composer" id="question-form">
          <textarea id="question-input" placeholder="输入问题，按 Ctrl/Command + Enter 发送"></textarea>
          <button class="primary-button" id="ask-button" type="submit">发送</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
